databases:
  - name: sales-db
    databaseName: sales_db
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------- FastAPI backend (native Python, no Docker) ----------
  - type: web
    name: sales-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Free tier has no shell access, so migrations + seeding run automatically
    # on every start. The seed script checks if data already exists and skips
    # itself if so, so this is safe to run on every deploy/restart.
    startCommand: "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        # Update after the two static sites below get their real onrender.com
        # URLs (comma-separated, no spaces) -- see README "one manual step".
        value: "https://sales-admin-dashboard.onrender.com,https://sales-salesman-app.onrender.com"

  # ---------- React Admin Dashboard (static site) ----------
  - type: web
    name: sales-admin-dashboard
    runtime: static
    rootDir: admin-dashboard
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sales-backend
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- React Salesman App (static site) ----------
  - type: web
    name: sales-salesman-app
    runtime: static
    rootDir: salesman-app
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sales-backend
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
